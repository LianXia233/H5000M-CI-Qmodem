# CI 项目
name: WRT-BUILD

# CI 计划
on:
  # 手动编译
  workflow_dispatch:
    inputs:
      CONFIG:
        description: '编译配置'
        default: 'H5000M-qmodem-next'
        required: true
        type: choice
        options:
          - H5000M-qmodem-next
          - H5000M-qmodem
          - H5000M-modem-pro
          - AP3000M-qmodem-next
          - AP3000M-qmodem
          - AP3000M-modem-pro
          - X86-qmodem-next
          - X86-qmodem
      SOURCE:
        description: '源码仓库（分支按仓库自动匹配，无需手动选择）'
        default: 'immortalwrt/immortalwrt'
        required: true
        type: choice
        options:
          - immortalwrt/immortalwrt
          - VIKINGYFY/immortalwrt
          - chasey-dev/immortalwrt-mt798x-rebase
      PACKAGE:
        description: '手动调整插件包，多个请用换行隔开'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件'
        default: false
        required: true
        type: boolean

# CI 权限
permissions: write-all

# CI 任务
jobs:
  # 按所选源码仓库（结合目标机型）自动推导分支，避免仓库与分支手动组合出错
  resolve:
    name: Resolve Branch
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
    steps:
      - name: Resolve Source Branch
        id: branch
        env:
          SOURCE: ${{ inputs.SOURCE }}
          CONFIG: ${{ inputs.CONFIG }}
        run: |
          case "$SOURCE" in
            immortalwrt/immortalwrt)
              BRANCH=master
              ;;
            chasey-dev/immortalwrt-mt798x-rebase)
              BRANCH=25.12
              ;;
            VIKINGYFY/immortalwrt)
              # 该仓库同时提供 main 与 owrt：MTK 机型走 owrt，其余平台走 main
              case "$CONFIG" in
                H5000M-*|AP3000M-*) BRANCH=owrt ;;
                *)                  BRANCH=main ;;
              esac
              ;;
            *)
              echo "::error title=Unsupported source::未知源码仓库 '$SOURCE'"
              exit 1
              ;;
          esac

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "源码：$SOURCE @ $BRANCH" >> "$GITHUB_STEP_SUMMARY"

  config:
    name: ${{ inputs.CONFIG }}
    needs: resolve
    # 调用公用编译核心 WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      # 编译配置
      WRT_CONFIG: ${{ inputs.CONFIG }}
      # 源码链接
      WRT_REPO: https://github.com/${{ inputs.SOURCE }}.git
      # 源码分支（由 resolve 任务按仓库与机型自动推导）
      WRT_BRANCH: ${{ needs.resolve.outputs.branch }}
      # 源码名称
      WRT_SOURCE: ${{ inputs.SOURCE }}
      # 插件调整
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      # 仅输出配置文件
      WRT_TEST: ${{ inputs.TEST }}
