# CI 项目
name: WRT-BUILD

# CI 计划
on:
  # 手动编译
  workflow_dispatch:
    inputs:
      CONFIG:
        description: '编译配置'
        default: 'H5000M-qmodem-next'
        required: true
        type: choice
        options:
          - H5000M-qmodem-next
          - H5000M-qmodem
          - H5000M-modem-pro
          - AP3000M-qmodem-next
          - AP3000M-qmodem
          - AP3000M-modem-pro
          - X86-qmodem-next
          - X86-qmodem
      SOURCE:
        description: '源码仓库（分支自动匹配；X86 固定 immortalwrt/master）'
        default: 'immortalwrt/immortalwrt'
        required: true
        type: choice
        options:
          - immortalwrt/immortalwrt
          - VIKINGYFY/immortalwrt
          - chasey-dev/immortalwrt-mt798x-rebase
      PACKAGE:
        description: '手动调整插件包，多个请用换行隔开'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件'
        default: false
        required: true
        type: boolean

# CI 权限
permissions: write-all

# CI 任务
jobs:
  # 按机型与所选源码仓库自动推导「源码 + 分支」，避免仓库与分支手动组合出错
  resolve:
    name: Resolve Source
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.resolve.outputs.source }}
      branch: ${{ steps.resolve.outputs.branch }}
    steps:
      - name: Resolve Source & Branch
        id: resolve
        env:
          SOURCE: ${{ inputs.SOURCE }}
          CONFIG: ${{ inputs.CONFIG }}
        run: |
          # X86 固定使用 immortalwrt 主线 master，不受 SOURCE 选择影响
          if [[ "$CONFIG" == X86-* ]]; then
            RESOLVED_SOURCE=immortalwrt/immortalwrt
            BRANCH=master
            if [[ "$SOURCE" != "$RESOLVED_SOURCE" ]]; then
              echo "::warning title=X86 源码已固定::X86 配置仅使用 immortalwrt/immortalwrt master，已忽略所选 '$SOURCE'"
            fi
          else
            RESOLVED_SOURCE="$SOURCE"
            case "$SOURCE" in
              immortalwrt/immortalwrt)
                BRANCH=master
                ;;
              chasey-dev/immortalwrt-mt798x-rebase)
                BRANCH=25.12
                ;;
              VIKINGYFY/immortalwrt)
                # 该仓库同时提供 main 与 owrt：MTK 机型（H5000M / AP3000M）走 owrt
                BRANCH=owrt
                ;;
              *)
                echo "::error title=Unsupported source::未知源码仓库 '$SOURCE'"
                exit 1
                ;;
            esac
          fi

          echo "source=$RESOLVED_SOURCE" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "源码：$RESOLVED_SOURCE @ $BRANCH" >> "$GITHUB_STEP_SUMMARY"

  config:
    name: ${{ inputs.CONFIG }}
    needs: resolve
    # 调用公用编译核心 WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      # 编译配置
      WRT_CONFIG: ${{ inputs.CONFIG }}
      # 源码链接（X86 固定 immortalwrt，其余按所选仓库）
      WRT_REPO: https://github.com/${{ needs.resolve.outputs.source }}.git
      # 源码分支（由 resolve 任务按机型与仓库自动推导）
      WRT_BRANCH: ${{ needs.resolve.outputs.branch }}
      # 源码名称
      WRT_SOURCE: ${{ needs.resolve.outputs.source }}
      # 插件调整
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      # 仅输出配置文件
      WRT_TEST: ${{ inputs.TEST }}
