# 云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        # 可选：未显式传入时从 Config/OWRT-DEFAULT.txt 读取
        required: false
        type: string
      WRT_NAME:
        required: false
        type: string
      WRT_IP:
        # 可选：未显式传入时从 Config/OWRT-DEFAULT.txt 读取
        required: false
        type: string
      WRT_PW:
        required: false
        type: string
      WRT_SSID:
        required: false
        type: string
      WRT_WORD:
        required: false
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    # 统一使用 Ubuntu 26.04（ubuntu-latest 自 2026-10-19 起滚动迁移到 26.04，
    # 显式写 ubuntu-26.04 可避免迁移期内落到 24.04 造成行为不一致）。
    # 上游 init_build_environment.sh 只识别到 noble，已在初始化步骤注入兼容补丁，
    # 把脚本内代号映射为 noble 以复用已验证的工具链参数。
    runs-on: ubuntu-26.04
    # 略低于平台 6h 硬上限：触发硬上限会直接杀掉 runner，
    # 缓存的 post 保存步骤会被整段跳过（见 AP3000M-qmodem 被取消的那次运行）
    timeout-minutes: 345
    steps:
      - name: Checkout Projects
        uses: actions/checkout@v7

      - name: Select Apt Mirror
        # azure.archive.ubuntu.com 会间歇性退化到几十 kB/s 且不报错，而内置
        # /etc/apt/apt-mirrors.txt 只在「镜像出错」时降级 —— 慢而不失败永远不触发它。
        # 2026-11-06 与 2026-11-10 的 Initialization Environment 失败都是此形态。
        #
        # 原探测用 8 MB Range 的平均 speed_download 二选一，2026-11-10 实测
        # azure=383233953 / archive=199029，据此「保持默认」，但真实 bulk .deb
        # 只有约 100 kB/s：Range 命中 CDN 边缘缓存后，峰值不能代表可持续吞吐。
        # 现改为多候选 + --speed-limit（持续低于 300 kB/s 即中止）选源，
        # 具体实现与阈值见 .github/scripts/select-apt-mirror.sh。
        #
        # 预算：4 候选 × 2 分片 × 15 s ≈ 2 分钟，之后两次 apt update 各 240 s，
        # 最坏合计约 10 分钟，故给 15 分钟。原来 8 分钟的预算里，探测吃掉
        # 2~3 分钟后，第二次 update 只剩二十来秒，重试形同虚设。
        timeout-minutes: 15
        run: |
          sudo bash "$GITHUB_WORKSPACE/.github/scripts/select-apt-mirror.sh"
          # 换源后必须重新取索引，否则后续 apt install 仍按旧源解析。
          timeout 240 sudo -E apt -yqq update || timeout 240 sudo -E apt -yqq update

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 释放托管 runner 的预装大件：build_dir 与缓存回填都在根分区，
          # 历史失败是连 runner 自己的 _diag 日志都写不下（No space left on device），
          # 属于构建中段爆盘而非编译错误。这里先腾出 ~25GB 再动手。
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/node \
                      /opt/hostedtoolcache/go /usr/local/share/boost \
                      /usr/local/.ghcup /opt/az /opt/microsoft /usr/share/swift \
                      2>/dev/null || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          # 托管 runner 的出口网络偶发抖动：2026-11-06 的故障里 apt 单包 47.5 kB
          # 用了 46 s，661 MB 依赖下载停在 Get:9 之后长时间无进展，job 最终被判
          # "lost communication"（连日志都没能上传）。给 apt 传输加硬超时与重试，
          # 卡住时最多约一分钟就以非零退出，失败点留在日志里，而不是拖成失联。
          sudo tee /etc/apt/apt.conf.d/99-ci-transfer-guard >/dev/null <<'EOF'
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::Retries "3";
          Acquire::http::Pipeline-Depth "0";
          # 这里不再设 Queue-Mode / Max-Connections：apt 的 http 方法按
          # URI 类型排队，access 模式也只保证「每类 URI 一条连接」，并不
          # 产生同 host 的并行下载，Max-Connections 亦非 http 方法文档化
          # 选项（见 apt.conf(5)、apt-transport-http(1)）。留着只会误导。
          # 661 MB 依赖的单流耗时，靠「选快源 + 放宽预算 + 重试时重新换源」兜。
          DPkg::Lock::Timeout "120";
          EOF
          timeout 300 sudo -E apt -yqq purge firefox
          # 移除 GitHub runners 预置的 google-chrome apt 源：其镜像偶发哈希不一致
          # （File has unexpected size / Mirror sync in progress?），会导致 `apt update`
          # 返回非零并中断整个初始化步骤（Process completed with exit code 100）。
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
          # 即使个别非必需源临时不可用也不中断初始化（重试一次）
          timeout 300 sudo -E apt -yqq update || timeout 300 sudo -E apt -yqq update
          # 不做 full-upgrade / autoremove：托管 runner 每次全量升级要数分钟，
          # 对 OpenWrt 编译没有收益，属于纯耗时项
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          timeout 600 sudo -E apt -yqq install dos2unix libfuse-dev ccache
          # 先落盘再执行：curl 卡住时 `<(...)` 会给 bash 喂空脚本，步骤反而"成功"，
          # 延迟到后续步骤才炸；落盘后能立刻校验内容并对下载本身设超时。
          timeout 90 curl -fsSL --retry 3 --max-time 60 \
            -o /tmp/init_build_environment.sh \
            https://build-scripts.immortalwrt.org/init_build_environment.sh
          wc -c /tmp/init_build_environment.sh
          # 空脚本或错误页会让随后的 for 循环白跑两轮，先在这里挡住。
          [ "$(stat -c%s /tmp/init_build_environment.sh)" -gt 2000 ] || {
            echo "::error::init_build_environment.sh looks truncated"
            exit 1
          }
          # 上游 check_system() 的代号白名单只到 noble，26.04 会直接 exit 1；
          # 注入兼容补丁，把脚本内代号映射为已验证的 noble 参数集（补丁幂等）。
          python3 "$GITHUB_WORKSPACE/.github/scripts/patch-init-env.py"
          # 上游脚本要下 661 MB 依赖包，正常 3~5 分钟。单次上限取 30 分钟：
          # 2026-11-10 的两次 20 分钟尝试都死在 texlive-lang-greek(79.2 MB)、
          # mupdf-tools(49.3 MB) 这种大包上，属于预算不足而非无限卡死；
          # 真正的网络僵死仍由 apt 的 Acquire::http::Timeout 兜底。
          # 超时后重试一次：apt 已下载的 .deb 留在 /var/cache/apt/archives，
          # 第二次只补缺的部分，等于断点续传，不是从头再来。
          # `sudo timeout` 的顺序不能颠倒：timeout 必须是 sudo 的子进程，才和 apt
          # 同属一个进程组、能真正把 apt 杀掉；写成 `timeout ... sudo apt` 时超时
          # 只杀死 sudo，apt 成孤儿继续持有 dpkg 锁，后续每次 apt 都卡在锁上。
          INIT_OK=0
          for i in 1 2; do
            if [ "$i" -gt 1 ]; then
              # 链路退化是实时的：第一次选中的源十分钟后可能已经不可用，
              # 重试必须重新实测换源，而不是原路重走一遍。
              sudo bash "$GITHUB_WORKSPACE/.github/scripts/select-apt-mirror.sh" || true
              # 上一轮被 timeout 杀掉时 dpkg 可能停在半配置态，
              # 不先修好会让第二次尝试直接卡在 dpkg 上。
              sudo dpkg --configure -a || true
              timeout 300 sudo -E apt -yqq update || true
            fi
            if sudo timeout --kill-after=30 1800 bash /tmp/init_build_environment.sh; then
              INIT_OK=1
              break
            fi
            echo "init_build_environment attempt ${i} failed or timed out" >&2
            pgrep -a apt || true
            sleep 10
          done
          if [ "$INIT_OK" != "1" ]; then
            echo "::error::init_build_environment failed twice; aborting to avoid wasting build time"
            exit 1
          fi
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt
          # 磁盘基线留痕：后续若再出现 No space left，可直接对照这一步的余量
          df -h / /mnt 2>/dev/null || df -h /

      - name: Initialization Values
        run: |
          case "$WRT_CONFIG" in
            ''|*[!A-Za-z0-9._-]*)
              echo "::error title=Invalid firmware configuration::WRT_CONFIG must contain only letters, numbers, dots, underscores, or hyphens."
              exit 1
              ;;
          esac

          CONFIG_FILE="$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt"
          if [ ! -s "$CONFIG_FILE" ]; then
            echo "::error title=Missing firmware configuration::Configuration '$WRT_CONFIG' was not found at $CONFIG_FILE."
            echo "Available configurations:"
            find "$GITHUB_WORKSPACE/Config" -maxdepth 1 -type f -name '*.txt' -printf '%f\n' | sed 's/\.txt$//'
            exit 1
          fi

          WRT_TARGET="$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' "$CONFIG_FILE")"
          if [ -z "$WRT_TARGET" ]; then
            echo "::error title=Invalid firmware configuration::Configuration '$WRT_CONFIG' does not define a target platform."
            exit 1
          fi

          # 一次 date 同时取出「标签时间戳」与「8 位编译日期」，避免两次调用
          # 恰好跨过零点，导致 Release 标签与产物文件名里的日期对不上。
          WRT_NOW="$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S:%Y%m%d")"
          echo "WRT_DATE=${WRT_NOW%%:*}" >> $GITHUB_ENV
          echo "WRT_DATE_SHORT=${WRT_NOW##*:}" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_CONFIG_FILE=$CONFIG_FILE" >> $GITHUB_ENV
          echo "WRT_TARGET=$WRT_TARGET" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV
          case "$WRT_CONFIG" in
            *-modem-pro)
              # 模组方案：modem-pro（独立本地 feed，取代 QModem）。
              # Rust 后端走宿主 rustup 直编：把开关注入后续所有步骤的环境
              # （含 feeds 包元数据扫描阶段），避免扫描把 feeds 的 rust/host
              # 记为 modem-pro 的构建依赖而触发 1~2 小时的 rustc + LLVM 源码编译。
              echo "WRT_VARIANT=modem-pro" >> $GITHUB_ENV
              echo "MODEM_PRO_HOST_RUST=1" >> $GITHUB_ENV
              ;;
            *-qmodem)
              echo "WRT_VARIANT=qmodem" >> $GITHUB_ENV
              ;;
            *)
              echo "WRT_VARIANT=qmodem-next" >> $GITHUB_ENV
              ;;
          esac

          # 根据配置推导机型显示名称
          case "$WRT_CONFIG" in
            H5000M-*)
              WRT_MODEL="Hiveton H5000M (MT5700M)"
              ;;
            AP3000M-*)
              WRT_MODEL="AirPi AP3000M"
              ;;
            X86-*)
              WRT_MODEL="x86 通用平台"
              ;;
            *)
              WRT_MODEL="Unknown Device"
              ;;
          esac
          echo "WRT_MODEL=$WRT_MODEL" >> $GITHUB_ENV

      - name: Load Default Settings
        # 局域网 / 无线等出厂参数统一从显式配置文件 Config/OWRT-DEFAULT.txt 读取；
        # 工作流 inputs 显式传入的值优先于配置文件默认值。
        run: |
          DEFAULT_FILE="$GITHUB_WORKSPACE/Config/OWRT-DEFAULT.txt"
          if [ ! -f "$DEFAULT_FILE" ]; then
            echo "::error title=Missing default settings::Config/OWRT-DEFAULT.txt not found."
            exit 1
          fi

          set -a
          . "$DEFAULT_FILE"
          set +a

          [ -n "${{ inputs.WRT_IP }}" ] && WRT_IP="${{ inputs.WRT_IP }}"
          [ -n "${{ inputs.WRT_PW }}" ] && WRT_PW="${{ inputs.WRT_PW }}"
          [ -n "${{ inputs.WRT_SSID }}" ] && WRT_SSID="${{ inputs.WRT_SSID }}"
          [ -n "${{ inputs.WRT_WORD }}" ] && WRT_WORD="${{ inputs.WRT_WORD }}"
          [ -n "${{ inputs.WRT_NAME }}" ] && WRT_NAME="${{ inputs.WRT_NAME }}"
          [ -n "${{ inputs.WRT_THEME }}" ] && WRT_THEME="${{ inputs.WRT_THEME }}"

          for VAR in WRT_IP WRT_PW WRT_SSID WRT_WORD \
                     WRT_NAME WRT_THEME WRT_TIMEZONE WRT_ZONENAME \
                     WIFI_ENCRYPTION WIFI_2G_WIDTH WIFI_5G_WIDTH WIFI_COUNTRY \
                     WRT_SSID_WIFI7 WRT_WORD_WIFI7 \
                     WIFI_ENCRYPTION_WIFI7 WIFI_2G_WIDTH_WIFI7 WIFI_5G_WIDTH_WIFI7 WIFI_COUNTRY_WIFI7; do
            echo "$VAR=${!VAR}" >> $GITHUB_ENV
          done

          echo "Loaded defaults: IP=${WRT_IP} name=${WRT_NAME} theme=${WRT_THEME} SSID=${WRT_SSID} 2G=${WIFI_2G_WIDTH}MHz 5G=${WIFI_5G_WIDTH}MHz country=${WIFI_COUNTRY} encryption=${WIFI_ENCRYPTION} timezone=${WRT_ZONENAME}"

      - name: Clone Code
        run: |
          if ! git ls-remote --exit-code --heads "$WRT_REPO" "$WRT_BRANCH" >/dev/null; then
            DEFAULT_BRANCH="$(git ls-remote --symref "$WRT_REPO" HEAD 2>/dev/null | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2; exit}')"
            echo "::error title=Source branch not found::Branch '$WRT_BRANCH' does not exist in $WRT_REPO."
            if [ -n "$DEFAULT_BRANCH" ]; then
              echo "The repository default branch is '$DEFAULT_BRANCH'. Update the BRANCH workflow input and rerun."
            fi
            exit 1
          fi

          git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Seed Modem-Pro Config (Before Feeds Scan)
        # modem-pro 的 Rust 后端走宿主 rustup 直编（MODEM_PRO_HOST_RUST=1）。OpenWrt 的
        # 包元数据扫描在 feeds 阶段就会跑（子 make 在每个包目录下 `make -r DUMP=1`），
        # 它会读 .config 决定各包构建依赖，结果写进 tmp/.packageinfo 后被后续 make 复用
        # （之后改 .config 不会触发重扫）。故必须在扫描【之前】把开关写进 .config，否则
        # 扫描会把 feeds 的 rust/host 记成 modem-pro 的构建依赖，之后无论怎么设都会去源码
        # 编译 rustc + LLVM（约 1~2 小时）。Custom Settings 阶段仍会再追加一次（同值不冲突）。
        if: contains(env.WRT_CONFIG, 'modem-pro')
        run: |
          cd ./wrt/
          {
            echo "CONFIG_PACKAGE_modem-pro=y"
            echo "CONFIG_MODEM_PRO_HOST_RUST=y"
          } >> .config
          echo "Seeded .config for modem-pro (host rustup direct build)"

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Check Caches (Toolchain & ccache)
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache/restore@v6
        with:
          # 保存改由作业末尾的 actions/cache/save 步骤完成（always()，前面步骤失败也保存）：
          # 工具链（含最耗时的 rust/host）在头 1~2 小时就编好了，
          # 不保存的话下次依旧从头冷编译，会陷入「超时→无缓存→再超时」的死循环
          # 关键改动：缓存键只绑定「目标平台 + 源码 + 分支」，不再绑定 commit hash。
          # 上游一有新提交也能通过 restore-keys 回退命中上次编译好的工具链。
          key: wrt-tc-${{env.WRT_TARGET}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_HASH}}
          restore-keys: |
            wrt-tc-${{env.WRT_TARGET}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Check Caches (Download)
        id: check-cache-dl
        if: env.WRT_TEST != 'true'
        uses: actions/cache/restore@v6
        with:
          # 保存同样由末尾的 actions/cache/save 步骤完成，编译失败也保留已下载的源码包
          # 下载的源码包与机型无关，按「源码 + 分支」单独缓存，避免多机型各存一份
          key: wrt-dl-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_HASH}}
          restore-keys: |
            wrt-dl-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-
          path: |
            ./wrt/dl

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skiped done!"
          else
            echo "caches missed!"
          fi

          # 不再在 cache miss 时删除历史缓存：
          # 上面的 restore-keys 正是依赖历史缓存做前缀回退，删掉等于每次都冷启动。
          # 配额交给 GitHub LRU 自动回收，必要时用 Cache-Clean 手动清理。

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 2026-10-17 修复：immortalwrt/packages 合并官方源（dd29469e22）后
          # miniupnpd 升级到 2.3.11，feed 自带的 020-descr-filter-fix.patch
          # 针对的是旧版解析器，其全部改动（upnppermissions.c 解析器重写、
          # upnppermissions.h 的 const char * 签名）已被 2.3.11 上游吸收，
          # 继续打补丁会因 7 个 hunk 中 5 个失败而中断所有平台的编译。
          # 删除该过时补丁，无功能损失；上游刷新补丁后可移除本 workaround。
          if [[ -f feeds/packages/net/miniupnpd/patches/020-descr-filter-fix.patch ]]; then
            rm -f feeds/packages/net/miniupnpd/patches/020-descr-filter-fix.patch
            echo "Removed obsolete miniupnpd patch 020-descr-filter-fix.patch (merged upstream in miniupnpd 2.3.11)"
          fi

          # 2026-10-17 修复（run #102 复现）：删掉 020 后 030-allow-private-fix.patch
          # 紧接着失败。该补丁仅一行改动（GetExternalIPAddress 中
          # !GETFLAG(ALLOWPRIVATEIPV4MASK) → GETFLAG(ALLOWPRIVATEIPV4MASK)），
          # miniupnpd 2.3.11 上游 upnpsoap.c 已是无 ! 的正确逻辑，补丁被吸收，
          # 打不上（Hunk #1 FAILED at 370），删除无功能损失。
          if [[ -f feeds/packages/net/miniupnpd/patches/030-allow-private-fix.patch ]]; then
            rm -f feeds/packages/net/miniupnpd/patches/030-allow-private-fix.patch
            echo "Removed obsolete miniupnpd patch 030-allow-private-fix.patch (merged upstream in miniupnpd 2.3.11)"
          fi

          # 2026-10-17 修复：040-improve-logging.patch 基于 2.3.x 旧版编写，
          # 2.3.11 中 print_usage 被前移至 main() 之前（hunk #3/#4 的搜索起点
          # 在 init() 之后，永远匹配不到），且 v.port = listen_port 与 syslog
          # 之间新增 ENABLE_NFQUEUE 三行导致 hunk #6/#7 超出默认 fuzz=2，
          # 默认 fuzz 下 12 个 hunk 中 4 个失败。该补丁仍是有效下游定制
          # （日志降噪、启动横幅、安全模式警告），不能简单删除。
          # 用仓库内针对 2.3.11 重新生成的等价补丁原地替换，上游刷新后可移除。
          if [[ -f feeds/packages/net/miniupnpd/patches/040-improve-logging.patch ]]; then
            cp -f "$GITHUB_WORKSPACE/Scripts/patches/miniupnpd-040-improve-logging-2.3.11.patch" \
              feeds/packages/net/miniupnpd/patches/040-improve-logging.patch
            echo "Refreshed miniupnpd patch 040-improve-logging.patch for miniupnpd 2.3.11"
          fi

          # 2026-10-31 修复（run #140）：2026-10-27 针对 firewall4
          # 2026.10.26~bac1d656 加的"仓库内刷新版补丁替换"workaround 在上游把
          # firewall4 升级到 2026.10.29~e6f600c4 后反向成了破坏源：上游已随版本
          # 同步刷新 001-firewall4-add-support-for-fullcone-nat.patch（parse_policy
          # 枚举新增 "npt"，行号整体后移），而仓库内固定在 bac1d656 的旧快照
          # hunk #5（"fullcone" 策略插入点）上下文失配（FAILED at 1543），两个
          # x86 job 全部在 prepare 阶段中断。已验证上游补丁对 e6f600c4 可干净
          # 套用（patch --dry-run 全部通过），按既定计划移除本 workaround，
          # 直接使用 feed 内随版本同步维护的补丁，避免再次漂移。
          # 若未来再次撞上上游"版本升级与补丁刷新未同 commit 落地"的竞态，
          # 参照 git 历史 6292c2d2 的做法临时替换，并同样注明移除条件。

      - name: Import luci-app-online-upgrade (All Models)
        # 全机型接入在线升级插件 v2（Rust 后端）。必须在 make defconfig 之前完成，
        # 否则 Config/GENERAL.txt 里的 CONFIG_PACKAGE_luci-app-online-upgrade=y
        # 找不到包而被 Kconfig 丢弃。脚本内部做结构断言与行尾归一化，失败即红。
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages-OnlineUpgrade.sh

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          # 按模组方案选择前端配置文件：
          #   qmodem-next（默认）→ QMODEM-NEXT.txt；qmodem → QMODEM.txt；modem-pro → MODEM-PRO.txt
          case "$WRT_VARIANT" in
            qmodem)    VARIANT_FILE="$GITHUB_WORKSPACE/Config/QMODEM.txt" ;;
            modem-pro) VARIANT_FILE="$GITHUB_WORKSPACE/Config/MODEM-PRO.txt" ;;
            *)         VARIANT_FILE="$GITHUB_WORKSPACE/Config/QMODEM-NEXT.txt" ;;
          esac

          # GENERAL.txt 必须在所有模式下加载：它是 qmodem 核心、通用插件与工具链
          # 配置的真实来源。TEST 模式此前跳过 GENERAL，生成的 .config 与实际固件
          # 相差数百个符号，既无法用于排查也无法验证配置合并顺序。
          cat "$WRT_CONFIG_FILE" "$GITHUB_WORKSPACE/Config/GENERAL.txt" "$VARIANT_FILE" >> .config

          # 启用 ccache，把编译缓存落到 ./.ccache（与上面缓存的 path 对应），
          # 重复编译、仅改配置或插件时可大幅缩短耗时
          echo "CONFIG_CCACHE=y" >> .config

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          # 保存合并后、defconfig 前的完整请求配置，供下一步逐符号核对
          # 是否有 qmodem / 前端 / 驱动 / 插件符号被 Kconfig 静默丢弃。
          cp .config .config.requested

          make defconfig && make clean

      - name: Verify Config (Defconfig Assertions)
        # 配置被静默丢弃是历史反复出现的问题（QModem feed 未注册、QMI choice 落回
        # 厂商驱动、input/audio 特性门控未开、驱动包更名等）。这里在编译前做硬断言：
        # 1) 请求配置中每个 =y 符号都必须在 defconfig 后仍为 y；
        # 2) 按变体校验 qmodem / 前端 / 短信栈 / 通用 QMI 驱动 / 互斥关系；
        # 3) 按机型校验设备与专有插件。
        # 任何一项失败都会以 ::error:: 注解并阻断构建，而不是带着缺包的固件继续。
        run: |
          cd ./wrt/
          python3 "$GITHUB_WORKSPACE/Scripts/check_defconfig.py" \
            --config .config \
            --requested .config.requested \
            --variant "$WRT_VARIANT" \
            --name "$WRT_CONFIG"

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Prebuild AirPi Rust Binary (AP3000M)
        # 仅 AP3000M 需要。luci-app-airpi-fancontrol 的守护进程 airpi-fanctl 由 Rust 编写，
        # 默认路径会让 OpenWrt 从源码构建一整套 rust/host（rustc + cargo + LLVM），约 1.5~3 小时，
        # 这正是 AP3000M 比同为 filogic 的 H5000M 恒定慢约 2 小时的原因。
        # 这里照搬上游 LianXia233/luci-app-airpi3000m-fancontrol 的 CI 做法：
        # 用 runner 自带的 rustup 配合源码树里已构建好的 aarch64 musl 交叉链接器直接 cargo
        # 交叉编译，再通过 AIRPI_PREBUILT=1 / AIRPI_PREBUILT_BIN 交给包 Makefile，
        # 从而完全跳过 rust/host 的源码构建。预编译失败会自动回退，不影响固件产出。
        if: contains(env.WRT_CONFIG, 'AP3000M') && env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          # 用绝对路径：下面的子 shell 会 cd 进 $PKG_DIR/src，相对路径会失效
          PKG_DIR="$(pwd)/package/luci-app-airpi-fancontrol"
          PREBUILT_DIR="$(pwd)/airpi-prebuilt"

          if [ ! -f "$PKG_DIR/src/Cargo.toml" ]; then
            echo "::warning::未找到 $PKG_DIR/src/Cargo.toml，跳过预编译（将由源码构建 rust/host）"
            exit 0
          fi

          # 失败即回退的正确写法：先在父 shell 关闭 errexit（GHA 的 run 默认是
          # bash -e），再把受保护子 shell 当作普通语句执行并取回退出码。
          # 不能写成 `if ( set -e; ... ); then`：作为 if 条件的复合命令会使其中的
          # errexit 全部失效，子 shell 会一路跑到底，最终由最后一条命令的退出码
          # 决定分支，中途失败被完全吞掉。
          set +e
          (
            set -euxo pipefail

            # 确保目标交叉链接器就绪：命中缓存时秒过，冷编译才会真正构建工具链
            make toolchain/install -j$(nproc)

            # 绝对路径：下面会 cd 进 $PKG_DIR/src，cargo 按当前工作目录解析相对
            # linker，写相对路径会得到 "linker ... not found"
            LINKER="$(find "$(pwd)/staging_dir" -type f -name 'aarch64-openwrt-linux-musl-gcc' -perm -111 | head -1)"
            [ -n "$LINKER" ] || LINKER="$(find "$(pwd)/staging_dir" -type f -name 'aarch64-*linux-musl-gcc' -perm -111 | head -1)"
            [ -n "$LINKER" ] || { echo "未找到 aarch64 musl 交叉链接器"; exit 1; }
            LINKER="$(readlink -f "$LINKER")"
            echo "使用交叉链接器: $LINKER"

            # runner 镜像通常自带 rustup，缺失时最小化安装
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable
            fi
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup target add aarch64-unknown-linux-musl

            # 用环境变量指定 linker，避免覆盖 runner 已有的 ~/.cargo/config.toml
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="$LINKER"

            cd "$PKG_DIR/src"
            cargo build --locked --release --target aarch64-unknown-linux-musl

            # 产物自检：cargo 退出 0 但产物缺失同样按失败处理，
            # 绝不能带着空目录进入注入分支
            BIN="target/aarch64-unknown-linux-musl/release/airpi-fanctl"
            [ -f "$BIN" ] || { echo "cargo 未产出 $BIN"; exit 1; }

            mkdir -p "$PREBUILT_DIR"
            cp -f "$BIN" "$PREBUILT_DIR/airpi-fanctl"

            # 让包走预编译分支，跳过 rust/host 源码构建
            python3 "$GITHUB_WORKSPACE/Scripts/inject_airpi_prebuilt.py" "$PKG_DIR/Makefile"
          )
          RC=$?
          set -e

          if [ "$RC" -eq 0 ]; then
            echo "airpi-fanctl 预编译完成，本次将跳过 rust/host 构建"
          else
            echo "::warning::airpi-fanctl 预编译失败（rc=$RC），回退到源码构建 rust/host（本次编译将额外增加约 1.5~3 小时）"
            # 清掉半成品：包 Makefile 未带 AIRPI_PREBUILT 标记时仍会走源码构建，
            # 留着二进制只会占空间并造成状态不一致
            rm -rf "$PREBUILT_DIR"
          fi

          # 一致性兜底：Makefile 已被标记预编译但二进制缺失时，
          # Build/Compile 里的 $(INSTALL_BIN) 会因 no such file 直接失败。
          # 这里主动撤销注入，确保任何情况下都不会停在这个死状态。
          if grep -q '^AIRPI_PREBUILT:=1$' "$PKG_DIR/Makefile" && [ ! -f "$PREBUILT_DIR/airpi-fanctl" ]; then
            echo "::warning::预编译标记与二进制不一致，撤销注入并回退源码构建"
            sed -i '/^AIRPI_PREBUILT:=1$/d; /^AIRPI_PREBUILT_BIN:=/d' "$PKG_DIR/Makefile"
            rm -rf "$PREBUILT_DIR"
          fi

      - name: Rust Cache (online-upgrade)
        # 缓存 ~/.cargo（registry 元数据与 crate 包）与 cargo target 目录：
        # 同一 commit 重复构建、以及不同机型的重复构建都只做增量编译。
        # 不设 per-config key，让同一架构的多个机型共用一份缓存（target 下按
        # target-triple 分目录，互不覆盖）；key 由 Cargo.lock 哈希决定，
        # 依赖变动时自动失效重建，不会拿到过期产物。
        if: env.WRT_TEST != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "wrt/package/luci-app-online-upgrade/rust -> .rust-build/online-upgrade/target"
          shared-key: online-upgrade
          cache-on-failure: "true"

      - name: Precompile online-upgrade Rust Backend (Official Rust SDK)
        # 用 Rust 官方 SDK（rustup stable + musl target）交叉编译，不使用 OpenWrt
        # SDK 自带的 rust（那套要走 buildroot 的 rust/host，1.5~3 小时量级）。
        # 交叉 C 编译器仍取 OpenWrt 工具链：ring 的 C/汇编部分与最终链接都由它完成，
        # 产物是静态 musl ELF，与包 Makefile 期望的 ./root/usr/bin/online-upgrade 对齐。
        # 与 OpenWrt SDK rust 的差异（README 已记录）：官方 SDK 的 rustc 版本更新，
        # 但两者都产出 static-musl 二进制；本包 Cargo.toml 已固定
        # opt-level=z / lto / codegen-units=1 / panic=abort / strip，运行时语义不变。
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          PKG_DIR="$(pwd)/package/luci-app-online-upgrade"
          BIN_OUT="$PKG_DIR/root/usr/bin/online-upgrade"
          CARGO_DIR="$PKG_DIR/rust"

          [ -f "$CARGO_DIR/Cargo.toml" ] || {
            echo "::error::未找到 $CARGO_DIR/Cargo.toml：插件包未就位（Import 步骤失败？）"
            exit 1
          }

          # 目标架构取自 defconfig 后的 .config，与固件产物架构严格一致
          ARCH_PKGS="$(sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\(.*\)"$/\1/p' ./.config | head -n1)"
          case "$ARCH_PKGS" in
            aarch64*) ARCH=aarch64; TRIPLE=aarch64-unknown-linux-musl; CPU_ARGS="-C target-cpu=cortex-a53" ;;
            x86_64*)  ARCH=x86_64;  TRIPLE=x86_64-unknown-linux-musl;  CPU_ARGS="" ;;
            *) echo "::error::不支持的目标架构 '${ARCH_PKGS}'（仅 aarch64_cortex-a53 / x86_64）"; exit 1 ;;
          esac
          # mt7981（H5000M / AP3000M）为 Cortex-A53，显式指定；x86 不设 target-cpu，
          # 保持基线指令集，避免在旧 CPU 上触发非法指令。

          # 交叉 C 编译器：ring 需要；同时作为 cargo 的 linker
          LINKER="$(find "$(pwd)/staging_dir" -type f -name "${ARCH}-openwrt-linux-musl-gcc" -perm -111 2>/dev/null | head -1)"
          if [ -z "$LINKER" ]; then
            echo "staging_dir 无 ${ARCH} musl 交叉 gcc，先构建工具链"
            make toolchain/install -j"$(nproc)"
            LINKER="$(find "$(pwd)/staging_dir" -type f -name "${ARCH}-openwrt-linux-musl-gcc" -perm -111 2>/dev/null | head -1)"
          fi
          [ -n "$LINKER" ] || { echo "::error::未找到 ${ARCH}-openwrt-linux-musl-gcc"; exit 1; }
          LINKER="$(readlink -f "$LINKER")"
          echo "交叉链接器：$LINKER"

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add "$TRIPLE" >/dev/null
          rustc --version

          # cc crate（ring 用）与 cargo 链接器命名规则不同，两套都要设
          TRIPLE_U="$(printf '%s' "$TRIPLE" | tr '-' '_')"
          TRIPLE_UC="$(printf '%s' "$TRIPLE" | tr '[:lower:]-' '[:upper:]_')"
          TOOL_BIN="$(dirname "$LINKER")"
          AR_BIN="$TOOL_BIN/${ARCH}-openwrt-linux-musl-ar"
          [ -x "$AR_BIN" ] || AR_BIN="$TOOL_BIN/${ARCH}-openwrt-linux-musl-gcc-ar"
          STRIP_BIN="$TOOL_BIN/${ARCH}-openwrt-linux-musl-strip"
          [ -x "$STRIP_BIN" ] || STRIP_BIN="$(command -v strip)"
          export "CC_${TRIPLE_U}=$LINKER"
          export "AR_${TRIPLE_U}=$AR_BIN"
          export "CARGO_TARGET_${TRIPLE_UC}_LINKER=$LINKER"
          export CARGO_TARGET_DIR="$(pwd)/.rust-build/online-upgrade/target"
          # shellcheck disable=SC2086
          export RUSTFLAGS="$CPU_ARGS"

          echo "开始编译（target=$TRIPLE，CPU_ARGS='${CPU_ARGS}'）"
          START=$SECONDS
          cargo build --locked --release --target "$TRIPLE" --manifest-path "$CARGO_DIR/Cargo.toml"
          ELAPSED=$((SECONDS - START))
          echo "cargo 编译耗时：${ELAPSED}s"

          BIN="$CARGO_TARGET_DIR/$TRIPLE/release/online-upgrade"
          [ -f "$BIN" ] || { echo "::error::cargo 未产出 $BIN"; exit 1; }

          # 显式 strip（profile 里已有 strip=true，这里再幂等收尾并打印体积变化）
          SIZE_BEFORE="$(stat -c %s "$BIN")"
          "$STRIP_BIN" --strip-unneeded "$BIN" 2>/dev/null || true
          SIZE_AFTER="$(stat -c %s "$BIN")"
          echo "二进制体积：strip 前 ${SIZE_BEFORE} 字节 → strip 后 ${SIZE_AFTER} 字节"

          # 落位与自检：架构不符或非静态链接会让设备上直接跑不起来，宁可在构建期红掉
          # x86_64-musl 默认 static-pie、aarch64-musl 为 statically linked，两者均无 INTERP/NEEDED，同属完全静态
          mkdir -p "$(dirname "$BIN_OUT")"
          install -m 0755 "$BIN" "$BIN_OUT"
          file "$BIN_OUT"
          file "$BIN_OUT" | grep -Eq "ELF 64-bit.*(ARM aarch64|x86-64).*(statically linked|static-pie linked)" || {
            echo "::error::$BIN_OUT 架构或链接方式不符（期望 ${ARCH} 静态 musl ELF）"
            exit 1
          }

          {
            echo "### online-upgrade Rust 后端（官方 SDK 交叉编译）"
            echo ""
            echo "- target: \`$TRIPLE\`"
            echo "- 链接器: \`$LINKER\`"
            echo "- 额外编译参数: \`${CPU_ARGS:-无}\`（profile 使用上游 opt-level=z / lto / codegen-units=1 / panic=abort）"
            echo "- cargo 耗时: ${ELAPSED}s（是否命中缓存见上方 rust-cache 日志）"
            echo "- 产物体积: ${SIZE_AFTER} 字节"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Host Rust Toolchain (Modem-Pro)
        # modem-pro 的 Rust 守护进程 modemd 由宿主 rustup 直编（MODEM_PRO_HOST_RUST=1）：
        # 需要宿主 rustc + 官方 aarch64-unknown-linux-musl target，链接交给工具链自带的
        # rust-lld（自包含静态 musl，无运行时 libc 依赖）。此步独立于 airpi 预编译步骤，
        # 保证工具链无论如何都就绪，并把 cargo 目录写入 PATH 供后续编译步骤使用。
        if: contains(env.WRT_CONFIG, 'modem-pro') && env.WRT_TEST != 'true'
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-unknown-linux-musl
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo --version
          rustup target list --installed

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          # 指向被缓存的 .ccache 目录，限制容量并开启压缩，避免占满 10GB 配额
          export CCACHE_DIR="$(pwd)/.ccache"
          export CCACHE_MAXSIZE=5G
          export CCACHE_COMPRESS=true
          ccache -z 2>/dev/null || true

          # 失败重试必须保持并行：原来的 make -j1 V=s 会退化成单线程，
          # 一次偶发失败就能把几小时的编译拖过上限被取消。
          # 输出同时写入 build.log：失败时提取首个出错包并以 ::error:: 注解上报，
          # 注解可经 check-runs API 直接读取，无需下载 blob 原始日志。
          # 必须同时关闭 errexit：GHA 的 run 以 bash -e 执行，
          # 开了 pipefail 后首次 make 失败会让整个步骤就地终止，
          # 后面的重试与失败诊断分支永远不会执行（只会留下 exit code 2）。
          set +e -o pipefail

          make -j$(nproc) 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}

          if [ "$RC" -ne 0 ]; then
            echo "第一次编译失败（rc=$RC），保持并行重试并追加日志"
            make -j$(nproc) V=s 2>&1 | tee -a build.log
            RC=${PIPESTATUS[0]}
          fi

          if [ "$RC" -ne 0 ]; then
            echo "::group::编译失败诊断"
            # OpenWrt/ImmortalWrt 失败标志：ERROR: package/xxx failed to build / Error N / Image too big
            grep -E "^(ERROR: |make(\\[[0-9]+\\])?: \*\*\* ).*(failed to build|Error [0-9]|too big)" build.log \
              | sort -u | head -n 10 | while IFS= read -r LINE; do echo "::error::$LINE"; done

            if ! grep -qE "^(ERROR: |make(\\[[0-9]+\\])?: \*\*\* )" build.log; then
              echo "::error::未匹配到包级错误行，输出日志末尾 30 行"
              tail -n 30 build.log
            else
              echo "--- 编译错误上下文（C/C++ / 链接 / 镜像）---"
              grep -nE "error:|Error [0-9]+|collect2:|undefined reference|too big" build.log | head -n 25
            fi
            echo "::endgroup::"
          fi

          ccache -s 2>/dev/null || true

          exit "$RC"

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          # 产物统一命名：<机型>-<模组插件>-<编译日期>[-<镜像类型>].<扩展名>
          # WRT_CONFIG 本身即 "<机型>-<模组插件>"（如 H5000M-qmodem-next），
          # 只靠文件名即可区分 qmodem-next / qmodem / modem-pro。镜像类型后缀
          # 必须保留：X86 单次构建产出多个完整镜像格式，去掉后会互相覆盖。
          # 源码与时间戳等冗余信息保留在 Release 标签与描述里，不再塞进文件名。
          #
          # 只发布「可直接刷写的完整固件」，其余一律不进 upload：
          #   白名单 slug：sysupgrade / factory / combined(-efi) / image(-efi)
          #   过滤：manifest、config.txt、kernel.bin、rootfs.*、targz-rootfs.*，
          #         以及 mt798x-ram-*-bl2 等不含 WRT_TARGET 的 DDR 引导辅助小 bin
          # 旧逻辑是「先全部搬进 upload，再按 <2MB 删小 bin」的黑名单：≥2MB 的
          # 辅助 bin 会漏网，<2MB 的合法固件又会被误删，兜底搬运还会把元数据
          # 无差别带进 Release。现在改为按镜像类型精确挑选，从源头杜绝杂项。

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename "$FILE" | cut -d '.' -f 2-)
              NAME=$(basename "$FILE" | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")

              # 剥掉平台 / 设备 / squashfs 前缀，只留能区分镜像格式的短标识：
              #   mediatek-filogic-hiveton_h5000m-squashfs-sysupgrade -> sysupgrade
              #   x86-64-generic-squashfs-combined-efi               -> combined-efi
              #   mediatek-filogic / x86-64（manifest）                -> 空
              IMG_SLUG="$(printf '%s' "$NAME" | sed -E \
                -e 's/^mediatek-filogic-(hiveton_h5000m|airpi_ap3000m)-//' \
                -e 's/^x86-64-generic-//' \
                -e 's/^mediatek-filogic-//' \
                -e 's/^x86-64-//' \
                -e 's/^squashfs-//')"
              # 白名单：只有完整固件镜像才允许进入 upload / Release。case 精确
              # 匹配，避免 rootfs / kernel / targz-rootfs / initramfs 调试镜像
              # 与 manifest 空值混进来；非白名单文件留在 bin/targets 随 make
              # clean 回收，不进 upload。
              case "$IMG_SLUG" in
                sysupgrade|factory|combined|combined-efi|image|image-efi)
                  NEW_FILE="$WRT_CONFIG-$WRT_DATE_SHORT-$IMG_SLUG.$EXT"
                  mv -f "$FILE" ./upload/"$NEW_FILE"
                  echo "[keep]   $(basename "$FILE") -> $NEW_FILE" ;;
                *)
                  echo "[filter] $(basename "$FILE") (slug=${IMG_SLUG:-空})" ;;
              esac
            done

            # 发布前自检：upload 必须非空，且每个文件都命中固件文件名白名单。
            # 上游产物结构变化时宁可构建失败，也不要发空 Release 或混进杂项。
            UPLOAD_COUNT=$(find ./upload/ -maxdepth 1 -type f | wc -l)
            if [ "$UPLOAD_COUNT" -eq 0 ]; then
              echo "::error::upload 为空，未产出任何完整固件，拒绝发布"
              exit 1
            fi
            for f in ./upload/*; do
              [ -f "$f" ] || continue
              case "$(basename "$f")" in
                *-sysupgrade.bin|*-factory.bin|*-combined.img.gz|*-combined.vmdk|*-combined-efi.img.gz|*-combined-efi.vmdk|*-image.iso|*-image-efi.iso) ;;
                *) echo "::error::upload 出现非固件文件：$(basename "$f")"; exit 1 ;;
              esac
            done
            echo "=== 待发布固件（$UPLOAD_COUNT 个）==="
            ls -lh ./upload/

            # 固件 SHA256 表：luci-app-online-upgrade v2 的 github.rs 会依次找
            # expected_sha256 配置 -> sha256sums / <固件>.sha256 资产 -> Release
            # 正文里「含目标文件名的 64 位 hex 行」。CI 已过滤掉所有非固件资产，
            # 因此把标准 sha256sum 格式（<hash>  <文件名>）写进 Release 正文，
            # 既能让 OTA 真正比对完整性，又不新增任何资产。
            # $GITHUB_ENV 用 heredoc 传多行值，Release body 再以环境变量引用。
            {
              echo "WRT_SHA256_TABLE<<WRT_SHA256_EOF"
              echo ""
              echo "### 固件校验（SHA256）"
              echo ""
              echo '```'
              ( cd ./upload && sha256sum * )
              echo '```'
              echo "WRT_SHA256_EOF"
            } >> "$GITHUB_ENV"

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        if: env.WRT_TEST != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          # 第二道闸门：即使打包环节漏进杂项，Release 也只发布白名单 glob
          files: |
            ./wrt/upload/*-sysupgrade.bin
            ./wrt/upload/*-factory.bin
            ./wrt/upload/*-combined.img.gz
            ./wrt/upload/*-combined.vmdk
            ./wrt/upload/*-combined-efi.img.gz
            ./wrt/upload/*-combined-efi.vmdk
            ./wrt/upload/*-image.iso
            ./wrt/upload/*-image-efi.iso
          body: |
            ${{ env.WRT_MODEL }} 定制固件 · 基于 ImmortalWrt

            模组方案：${{env.WRT_VARIANT}}

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI 名称：${{env.WRT_SSID}}
            WIFI 密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}
            ${{env.WRT_SHA256_TABLE}}

      # save-always 已弃用且行为不可靠，改为独立的 restore/save 两步。
      # save 放在作业末尾并用 always()，保留「即使前面步骤失败也保存缓存」的语义；
      # key 复用 restore 解析出的主键，确保与恢复时的键完全一致。
      - name: Save Caches (Toolchain & ccache)
        if: always() && env.WRT_TEST != 'true' && steps.check-cache.outputs.cache-primary-key != '' && steps.check-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.check-cache.outputs.cache-primary-key }}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Save Caches (Download)
        if: always() && env.WRT_TEST != 'true' && steps.check-cache-dl.outputs.cache-primary-key != '' && steps.check-cache-dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.check-cache-dl.outputs.cache-primary-key }}
          path: |
            ./wrt/dl
