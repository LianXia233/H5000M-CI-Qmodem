# 云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          # 移除 GitHub runners 预置的 google-chrome apt 源：其镜像偶发哈希不一致
          # （File has unexpected size / Mirror sync in progress?），会导致 `apt update`
          # 返回非零并中断整个初始化步骤（Process completed with exit code 100）。
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
          # 即使个别非必需源临时不可用也不中断初始化（重试一次）
          sudo -E apt -yqq update || sudo -E apt -yqq update
          # 不做 full-upgrade / autoremove：托管 runner 每次全量升级要数分钟，
          # 对 OpenWrt 编译没有收益，属于纯耗时项
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev ccache
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          case "$WRT_CONFIG" in
            ''|*[!A-Za-z0-9._-]*)
              echo "::error title=Invalid firmware configuration::WRT_CONFIG must contain only letters, numbers, dots, underscores, or hyphens."
              exit 1
              ;;
          esac

          CONFIG_FILE="$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt"
          if [ ! -s "$CONFIG_FILE" ]; then
            echo "::error title=Missing firmware configuration::Configuration '$WRT_CONFIG' was not found at $CONFIG_FILE."
            echo "Available configurations:"
            find "$GITHUB_WORKSPACE/Config" -maxdepth 1 -type f -name '*.txt' -printf '%f\n' | sed 's/\.txt$//'
            exit 1
          fi

          WRT_TARGET="$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' "$CONFIG_FILE")"
          if [ -z "$WRT_TARGET" ]; then
            echo "::error title=Invalid firmware configuration::Configuration '$WRT_CONFIG' does not define a target platform."
            exit 1
          fi

          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_CONFIG_FILE=$CONFIG_FILE" >> $GITHUB_ENV
          echo "WRT_TARGET=$WRT_TARGET" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV
          case "$WRT_CONFIG" in
            *-qmodem)
              echo "WRT_VARIANT=qmodem" >> $GITHUB_ENV
              ;;
            *)
              echo "WRT_VARIANT=qmodem-next" >> $GITHUB_ENV
              ;;
          esac

          # 根据配置推导机型显示名称
          case "$WRT_CONFIG" in
            H5000M-*)
              WRT_MODEL="Hiveton H5000M (MT5700M)"
              ;;
            AP3000M-*)
              WRT_MODEL="AirPi AP3000M"
              ;;
            X86-*)
              WRT_MODEL="x86 通用平台"
              ;;
            *)
              WRT_MODEL="Unknown Device"
              ;;
          esac
          echo "WRT_MODEL=$WRT_MODEL" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          if ! git ls-remote --exit-code --heads "$WRT_REPO" "$WRT_BRANCH" >/dev/null; then
            DEFAULT_BRANCH="$(git ls-remote --symref "$WRT_REPO" HEAD 2>/dev/null | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2; exit}')"
            echo "::error title=Source branch not found::Branch '$WRT_BRANCH' does not exist in $WRT_REPO."
            if [ -n "$DEFAULT_BRANCH" ]; then
              echo "The repository default branch is '$DEFAULT_BRANCH'. Update the BRANCH workflow input and rerun."
            fi
            exit 1
          fi

          git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Check Caches (Toolchain & ccache)
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@v4
        with:
          # 关键改动：缓存键只绑定「目标平台 + 源码 + 分支」，不再绑定 commit hash。
          # 上游一有新提交也能通过 restore-keys 回退命中上次编译好的工具链。
          key: wrt-tc-${{env.WRT_TARGET}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_HASH}}
          restore-keys: |
            wrt-tc-${{env.WRT_TARGET}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Check Caches (Download)
        if: env.WRT_TEST != 'true'
        uses: actions/cache@v4
        with:
          # 下载的源码包与机型无关，按「源码 + 分支」单独缓存，避免多机型各存一份
          key: wrt-dl-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_HASH}}
          restore-keys: |
            wrt-dl-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-
          path: |
            ./wrt/dl

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skiped done!"
          else
            echo "caches missed!"
          fi

          # 不再在 cache miss 时删除历史缓存：
          # 上面的 restore-keys 正是依赖历史缓存做前缀回退，删掉等于每次都冷启动。
          # 配额交给 GitHub LRU 自动回收，必要时用 Cache-Clean 手动清理。

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            VARIANT_FILE="$GITHUB_WORKSPACE/Config/QMODEM-NEXT.txt"
            [[ "$WRT_VARIANT" == "qmodem" ]] && VARIANT_FILE="$GITHUB_WORKSPACE/Config/QMODEM.txt"
            cat "$WRT_CONFIG_FILE" "$VARIANT_FILE" >> .config
          else
            VARIANT_FILE="$GITHUB_WORKSPACE/Config/QMODEM-NEXT.txt"
            [[ "$WRT_VARIANT" == "qmodem" ]] && VARIANT_FILE="$GITHUB_WORKSPACE/Config/QMODEM.txt"
            cat "$WRT_CONFIG_FILE" "$GITHUB_WORKSPACE/Config/GENERAL.txt" "$VARIANT_FILE" >> .config
          fi

          # 启用 ccache，把编译缓存落到 ./.ccache（与上面缓存的 path 对应），
          # 重复编译、仅改配置或插件时可大幅缩短耗时
          echo "CONFIG_CCACHE=y" >> .config

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig && make clean

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          # 指向被缓存的 .ccache 目录，限制容量并开启压缩，避免占满 10GB 配额
          export CCACHE_DIR="$(pwd)/.ccache"
          export CCACHE_MAXSIZE=5G
          export CCACHE_COMPRESS=true
          ccache -z 2>/dev/null || true

          make -j$(nproc) || make -j1 V=s

          ccache -s 2>/dev/null || true

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        if: env.WRT_TEST != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            ${{ env.WRT_MODEL }} 定制固件 · 基于 ImmortalWrt

            QModem 配置：${{env.WRT_VARIANT}}

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI 名称：${{env.WRT_SSID}}
            WIFI 密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}
