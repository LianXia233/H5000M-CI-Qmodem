name: Cache-Clean

on:
  # 不再每周定时全量清空：那会让本周第一次编译必然冷启动（多花 20~40 分钟）。
  # GitHub 会按 LRU 自动回收超配额缓存，需要彻底清理时手动触发本工作流即可。
  workflow_dispatch:

permissions: write-all

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4

      - name: Cache Clean
        run: gh cache delete --all
